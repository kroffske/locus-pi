schema = "locus.topology.v1"
exclude_paths = [".locus/**", ".tasks/**", ".test_pi/**", ".claude/**", ".pi/**", ".locus-pi/**"]

# Per-file code-line ceilings were removed on 2026-09-12 (T-218 W1). `locus topology check`
# already fails on growth since the base ref, so a ceiling per file only documented
# historical size. Record a new exception only for growth that a reviewer accepted,
# with an owner and a trigger that says when it is revisited.

[[exceptions]]
path = "tests/extensions/workflows/runtime"
rule = "directory-files"
ceiling = 60
owner = "workflows runtime tests"
reason = "Runtime behavior tests mirror their production owner; T-218 (2026-09-12) adds one test file per extracted owner."
trigger = "T-218 splits runtime owners into more files and mirrors them in tests; revisit the ceiling at T-218 W17 closure."

[[exceptions]]
path = "tests/shared/agent-runtime"
rule = "directory-files"
ceiling = 16
owner = "shared agent runtime tests"
reason = "Shared agent runtime tests intentionally mirror the named shared production layer."
trigger = "Split when the directory exceeds 12 direct files or a stable agent-runtime sub-owner gains four tests."

[[exceptions]]
path = "extensions/workflows/runtime"
rule = "directory-files"
ceiling = 45
owner = "workflows runtime"
reason = "T-218 (2026-09-12) extracts single-owner modules (execution state, groups, agent call/attempt/output, fusion, journal format, snapshot, workspace, admission, resume, saved child, finalization) out of the runtime/runner/journal monoliths; the file count rises by design."
trigger = "Revisit at T-218 W17 closure; any file added for a reason other than a T-218 owner extraction needs its own review."

[[exceptions]]
path = "scripts"
rule = "directory-files"
ceiling = 16
owner = "repository gates"
reason = "T-218 W1 (2026-09-12) adds scripts/check-topology.mjs, the size-ratchet entry that check:push runs."
trigger = "A new gate script beyond 16 files needs review; consolidate gate entry points before adding more."
