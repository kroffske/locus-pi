schema = "locus.topology.v1"
exclude_paths = [".locus/**", ".tasks/**", ".test_pi/**", ".claude/**", ".pi/**", ".locus-pi/**"]

# Per-file code-line ceilings were removed on 2026-09-12 (T-218 W1). `locus topology check`
# already fails on growth since the base ref, so a ceiling per file only documented
# historical size. Record a new exception only for growth that a reviewer accepted,
# with an owner and a trigger that says when it is revisited.

[[exceptions]]
path = "tests/extensions/workflows/runtime"
rule = "directory-files"
ceiling = 60
owner = "workflows runtime tests"
reason = "Runtime behavior tests mirror their production owner; T-218 (2026-09-12) adds one test file per extracted owner."
trigger = "T-218 splits runtime owners into more files and mirrors them in tests; revisit the ceiling at T-218 W17 closure."

[[exceptions]]
path = "tests/shared/agent-runtime"
rule = "directory-files"
ceiling = 16
owner = "shared agent runtime tests"
reason = "Shared agent runtime tests intentionally mirror the named shared production layer."
trigger = "Split when the directory exceeds 12 direct files or a stable agent-runtime sub-owner gains four tests."

[[exceptions]]
path = "extensions/workflows/runtime"
rule = "directory-files"
ceiling = 45
owner = "workflows runtime"
reason = "T-218 (2026-09-12) extracts single-owner modules (execution state, groups, agent call/attempt/output, fusion, journal format, snapshot, workspace, admission, resume, saved child, finalization) out of the runtime/runner/journal monoliths; the file count rises by design."
trigger = "Revisit at T-218 W17 closure; any file added for a reason other than a T-218 owner extraction needs its own review."

[[exceptions]]
path = "scripts"
rule = "directory-files"
ceiling = 16
owner = "repository gates"
reason = "T-218 W1 (2026-09-12) adds scripts/check-topology.mjs, the size-ratchet entry that check:push runs."
trigger = "A new gate script beyond 16 files needs review; consolidate gate entry points before adding more."

[[exceptions]]
path = "extensions/workflows/runtime/workflow-workspace.ts"
rule = "code-lines"
ceiling = 560
owner = "workflow workspace identity"
reason = "T-218 W6 (2026-09-12): workspace path/physical identity, file operations and primary-file proofs extracted verbatim from the 1147-line workflow-output.ts; one owner, one reason to change."
trigger = "Growth above 560 lines means a second concern crept in; split it out instead of raising this."

[[exceptions]]
path = "extensions/workflows/runtime/workflow-workspace-state.ts"
rule = "code-lines"
ceiling = 660
owner = "workflow workspace state"
reason = "T-218 W6 (2026-09-12): root lease/fencing, checkpoints and fresh-namespace state extracted verbatim from workflow-output.ts. Lease and checkpoint halves are separable if this owner grows."
trigger = "Growth above 660 lines: split the lease protocol from checkpoints before adding code."

[[exceptions]]
path = "tests/integration/package-boundary.test.ts"
rule = "code-lines"
ceiling = 830
owner = "package boundary contract"
reason = "Package-wide inventory test; each T-218 owner extraction adds a two-line reason next to the packed-file count."
trigger = "Above 830 lines, move the packed-file reason log out of the test body."

[[exceptions]]
path = "extensions/workflows/runtime/workflow-journal-format.ts"
rule = "code-lines"
ceiling = 960
owner = "workflow journal event contract"
reason = "T-218 W4 (2026-09-12): the journal line type, the per-kind field matrix and the strict codec are one versioned contract; splitting types from codec would recreate the two-file read the slice removed."
trigger = "Growth above 960 lines means a new event kind or a second concern; review the event contract before adding code."

[[exceptions]]
path = "scripts/check-extension-layers.ts"
rule = "code-lines"
ceiling = 1000
owner = "architecture ledger"
reason = "AGENTS.md requires one ledger entry per new internal owner, so this file grows by a few lines per T-218 slice by design; the rule engine itself does not grow."
trigger = "Above 1000 lines, move the ledger data (module lists) out of the rule engine into a data file."

[[exceptions]]
path = "extensions/workflows/source/workflow-source-provenance.ts"
rule = "code-lines"
ceiling = 690
owner = "workflow source provenance analysis"
reason = "T-218 W15 (2026-09-12): one fixed-point provenance analysis plus its query family, extracted verbatim from the 2443-line source checker."
trigger = "Growth above 690 lines: split the query API from the analysis."

[[exceptions]]
path = "extensions/workflows/source/workflow-source-value-rules.ts"
rule = "code-lines"
ceiling = 650
owner = "workflow source value-use rules"
reason = "T-218 W15 (2026-09-12): the permitted-value-use rules, extracted verbatim; validateStandardValueUses alone is 155 lines."
trigger = "Growth above 650 lines: split validateStandardValueUses by rule family."

[[exceptions]]
path = "tests/extensions/workflows/authoring/workflow-source-grammar-contract.test.ts"
rule = "code-lines"
ceiling = 570
owner = "workflow source grammar tests"
reason = "T-218 W15: grammar/policy acceptance table moved out of the 1679-line authoring contract suite."
trigger = "Above 570 lines, split by diagnostic family."

[[exceptions]]
path = "tests/extensions/workflows/authoring/workflow-source-value-contract.test.ts"
rule = "code-lines"
ceiling = 630
owner = "workflow source value-use tests"
reason = "T-218 W15: provenance/value-use acceptance table moved out of the authoring contract suite."
trigger = "Above 630 lines, split by rule family."

[[exceptions]]
path = "tests/extensions/workflows/operator"
rule = "directory-files"
ceiling = 12
owner = "workflow operator surface tests"
reason = "T-218 W16 (2026-09-12): the 2579-line progress suite is partitioned by owner (render, surfaces, state, install)."
trigger = "Above 12 files, revisit the operator test layout."

[[exceptions]]
path = "tests/extensions/workflows/operator/workflow-progress-render.test.ts"
rule = "code-lines"
ceiling = 1450
owner = "workflow progress render tests"
reason = "T-218 W16: the rendering/viewport cases (44) of the former 2579-line suite, moved not rewritten."
trigger = "Do not grow; split rail vs roster rendering when the next case lands."

[[exceptions]]
path = "tests/extensions/workflows/operator/workflow-progress-surfaces.test.ts"
rule = "code-lines"
ceiling = 930
owner = "workflow progress surface tests"
reason = "T-218 W16: terminal/headless projection cases (18) of the former suite."
trigger = "Above 930 lines, split terminal from headless."

[[exceptions]]
path = "extensions/_shared/agent-runtime/agent-live-panel.ts"
rule = "code-lines"
ceiling = 960
owner = "shared agent live panel"
reason = "T-218 W16: countAgentLiveStatuses moved here because both the workflow progress header and the agents observer read it; +11 lines."
trigger = "Above 960 lines, extract row projections from the panel."

[[exceptions]]
path = "extensions/workflows/runtime/workflow-groups.ts"
rule = "code-lines"
ceiling = 550
owner = "workflow group execution"
reason = "T-218 W7 (2026-09-12): group barriers, branch context and the per-call scheduler, cut verbatim out of the runtime; 35 lines over the threshold."
trigger = "Growth above 550 lines: split the barrier-result half (group failure error/envelope/classification) from the scheduler and branch context."

[[exceptions]]
path = "extensions/workflows/runtime/workflow-result.ts"
rule = "code-lines"
ceiling = 760
owner = "workflow result persistence and readback"
reason = "T-218 W5 (2026-09-12): write and tolerant readback of runtime/result.json and outputs/workflow-result.md now have one owner; the ~310-line envelope parser is the next seam (workflow-result-format.ts) if it grows."
trigger = "Growth above 760 lines: extract the envelope parser into a result-format module, mirroring artifact/journal format."

[[exceptions]]
path = "tests/extensions/workflows/runtime/workflow-saved-child.test.ts"
rule = "code-lines"
ceiling = 1500
owner = "workflow saved-child tests"
reason = "T-218 W12 (2026-09-12): the 47 saved-child cases moved out of the 2692-line durable suite unchanged; total test lines fell."
trigger = "W13 moves the ~20 resume/workspace-identity binding cases to the resume-authority suite; do not grow this file before that."
