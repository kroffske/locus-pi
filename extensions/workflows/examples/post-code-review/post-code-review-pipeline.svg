  <text x="78" y="111" class="sans tag" fill="#92400e">OPERATOR · LAUNCH</text>
  <text x="78" y="135" class="mono node-title">/workflows run post-code-review</text>
  <text x="78" y="154" class="sans small">review request · explicit --output-dir</text>
  <path d="M 306 164 L 306 184" class="edge" />
  <text x="320" y="178" class="sans edge-label">request + outputDir</text>

