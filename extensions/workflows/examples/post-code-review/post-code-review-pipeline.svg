    </style>
  </defs>

  <rect width="1600" height="1180" fill="#ffffff" />

  <text x="56" y="46" class="sans h1">Post-code review — one entry point, five child workflows</text>
  <text x="56" y="73" class="sans subtitle">Every workflow box names the exact source file. The parent controls the graph and makes zero model calls.</text>

