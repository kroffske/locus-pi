<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="diagram-title diagram-desc" preserveAspectRatio="xMidYMid meet">
  <title id="diagram-title">post-code-review: one external workflow, five child workflows, one published report</title>
  <desc id="diagram-desc">An operator runs post-code-review.workflow.mjs, the only external entry point. The parent calls no model. First, post-code-review-scope.workflow.mjs writes review-scope.md. Next, post-code-review-boundaries.workflow.mjs, post-code-review-simplicity.workflow.mjs, and post-code-review-contracts.workflow.mjs run in parallel and write three independent reports. Then post-code-review-synthesis.workflow.mjs reads all four reports and writes post-code-review.md. Finally, the parent publishes that report. The internal runtime phase identifiers are scope, audit-barrier, synthesis, and publish. A missing or shadowed child, a failed child or agent, or a failed write or publication stops successful publication.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c" />
    </marker>
