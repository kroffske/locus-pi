<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 900" width="1120" height="900" role="img" aria-label="The requirements-grill workflow as three named agents: a scout reads the repository and hands its context to a challenger, the challenger attacks the request against the same files and hands its objections on, and a synthesizer composes the requirements handoff from both texts.">
  <title>requirements-grill workflow — three agents and what each one hands to the next</title>
  <desc>A scout searches the repository with read-only tools and returns context.md, saying what exists today and what it could not settle. A challenger receives the request and that context, reopens the files the context names, and returns challenge.md: unobservable goals, open decisions, contradicted assumptions, missing scope, and what the repository already satisfies. A synthesizer receives the request and both texts, holds no tools at all, and returns requirements.md — refined requirements, observable acceptance criteria, stated assumptions, non-goals and the questions still open. That text is the run's terminal result. Nothing loops and nothing branches, so no stage declares an answer shape. The run never pauses for a human: a decision the evidence can settle is recorded as a stated assumption, and one it cannot is returned as an open question. An empty request fails before any agent runs; its length is the host’s to bound, not this script’s.</desc>

  <style>
    .bg { fill: #ffffff; }
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h1 { font-size: 21px; font-weight: 700; fill: #0f172a; }
    .h2 { font-size: 13px; fill: #475569; }
    .lane { font-size: 11px; font-weight: 700; fill: #94a3b8; letter-spacing: 0.08em; }

    .agent rect { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .agent .name { font-size: 20px; font-weight: 700; fill: #065f46; }
    .agent .role { font-size: 12px; fill: #047857; }
    .agent .line { font-size: 12.5px; fill: #334155; }
    .agent .chip { font-size: 11px; fill: #64748b; }

    .phase rect { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.4; }
    .phase text { font-size: 12px; fill: #3730a3; font-weight: 700; }
    .artifact rect { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.4; }
    .artifact text { font-size: 11.5px; fill: #9a3412; }

    .io rect { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.6; }
    .io .name { font-size: 14px; font-weight: 700; fill: #334155; }
    .io .line { font-size: 12px; fill: #475569; }

    .done rect { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
    .done .name { font-size: 15px; font-weight: 700; fill: #14532d; }
    .done .line { font-size: 12px; fill: #334155; }
    .stop rect { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.8; }
    .stop .name { font-size: 14px; font-weight: 700; fill: #991b1b; }
    .stop .line { font-size: 12px; fill: #334155; }

    .handoff { stroke: #059669; stroke-width: 2.2; fill: none; }
    .handoff-label { font-size: 12.5px; fill: #065f46; font-weight: 700; }
    .edge { stroke: #64748b; stroke-width: 1.6; fill: none; }
    .edge-soft { stroke: #cbd5e1; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; }
    .edge-label { font-size: 11.5px; fill: #475569; }
  </style>

  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cbd5e1"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1120" height="900"/>

  <text class="h1" x="50" y="40">requirements-grill — three agents, and what each hands to the next</text>
  <text class="h2" x="50" y="62">The script does not search. The agents do: the scout looks the repository up, and the challenger reopens what the scout claims before attacking the request.</text>

  <text class="lane" x="50" y="92">SCRIPT PHASE</text>
  <text class="lane" x="330" y="92">AGENTS</text>
  <text class="lane" x="850" y="92">PERSISTED</text>

  <!-- operator input -->
  <g class="io">
    <rect x="330" y="104" width="440" height="52" rx="10"/>
    <text class="name" x="352" y="127">Operator request</text>
    <text class="line" x="352" y="146">a rough requirement; the host bounds its length</text>
  </g>
  <g class="artifact">
    <rect x="850" y="110" width="220" height="40" rx="8"/>
    <text x="866" y="135">request.md</text>
  </g>
  <path class="edge-soft" d="M 770 130 L 850 130" marker-end="url(#s)"/>

  <!-- an empty request never reaches an agent -->
  <path class="edge" d="M 330 130 L 250 130" marker-end="url(#a)"/>
  <g class="stop">
    <rect x="50" y="104" width="196" height="70" rx="10"/>
    <text class="name" x="66" y="128">Empty request</text>
    <text class="line" x="66" y="147">The run fails before the</text>
    <text class="line" x="66" y="164">first agent is spawned.</text>
  </g>

  <path class="handoff" d="M 550 156 L 550 206" marker-end="url(#g)"/>
  <text class="handoff-label" x="562" y="188">the request, verbatim</text>

  <!-- scout -->
  <g class="phase">
    <rect x="50" y="206" width="200" height="34" rx="8"/>
    <text x="66" y="228">scout-repository</text>
  </g>
  <g class="agent">
    <rect x="330" y="206" width="440" height="144" rx="12"/>
    <text class="name" x="352" y="238">scout</text>
    <text class="role" x="352" y="258">Reports what exists. Builds nothing.</text>
    <text class="line" x="352" y="282">receives — the operator request</text>
    <text class="line" x="352" y="301">returns — what this repository already does here, and what</text>
    <text class="line" x="352" y="319">it could not settle</text>
    <text class="chip" x="352" y="338">read-only · read, git_read, ast_index, grep, find</text>
  </g>
  <g class="artifact">
    <rect x="850" y="253" width="220" height="40" rx="8"/>
    <text x="866" y="278">context.md</text>
  </g>
  <path class="edge-soft" d="M 770 273 L 850 273" marker-end="url(#s)"/>

  <path class="handoff" d="M 550 350 L 550 400" marker-end="url(#g)"/>
  <text class="handoff-label" x="562" y="368">the repository facts the request depends on</text>
  <text class="edge-label" x="562" y="388">a claim about the repository, not evidence about it</text>

  <!-- challenger -->
  <g class="phase">
    <rect x="50" y="400" width="200" height="34" rx="8"/>
    <text x="66" y="422">challenge-request</text>
  </g>
  <g class="agent">
    <rect x="330" y="400" width="440" height="152" rx="12"/>
    <text class="name" x="352" y="432">challenger</text>
    <text class="role" x="352" y="452">Attacks the request. Writes no requirements.</text>
    <text class="line" x="352" y="476">receives — the request and the scout's context</text>
    <text class="line" x="352" y="495">returns — unobservable goals, open decisions, contradicted</text>
    <text class="line" x="352" y="513">assumptions, missing scope, what is already satisfied</text>
    <text class="chip" x="352" y="533">read-only · reopens the files the context names</text>
  </g>
  <g class="artifact">
    <rect x="850" y="456" width="220" height="40" rx="8"/>
    <text x="866" y="481">challenge.md</text>
  </g>
  <path class="edge-soft" d="M 770 476 L 850 476" marker-end="url(#s)"/>

  <path class="handoff" d="M 550 552 L 550 612" marker-end="url(#g)"/>
  <text class="handoff-label" x="562" y="580">the objections, verbatim</text>
  <text class="edge-label" x="562" y="600">with the request and the context the challenger had</text>

  <!-- synthesizer -->
  <g class="phase">
    <rect x="50" y="612" width="200" height="34" rx="8"/>
    <text x="66" y="634">synthesize-handoff</text>
  </g>
  <g class="agent">
    <rect x="330" y="612" width="440" height="152" rx="12"/>
    <text class="name" x="352" y="644">synthesizer</text>
    <text class="role" x="352" y="664">Composes the handoff. Looks nothing up.</text>
    <text class="line" x="352" y="688">receives — the request, the context, and the objections</text>
    <text class="line" x="352" y="707">returns — requirements, observable acceptance criteria,</text>
    <text class="line" x="352" y="725">assumptions, non-goals, and what is still open</text>
    <text class="chip" x="352" y="745">no tools at all · the two texts are its whole evidence</text>
  </g>
  <g class="artifact">
    <rect x="850" y="668" width="220" height="40" rx="8"/>
    <text x="866" y="693">requirements.md</text>
  </g>
  <path class="edge-soft" d="M 770 688 L 850 688" marker-end="url(#s)"/>

  <path class="edge" d="M 550 764 L 550 792" marker-end="url(#a)"/>
  <g class="done">
    <rect x="330" y="792" width="560" height="88" rx="12"/>
    <text class="name" x="352" y="820">The run returns the requirements handoff</text>
    <text class="line" x="352" y="842">Its final text is retained as requirements.md. Nothing loops and nothing branches,</text>
    <text class="line" x="352" y="862">so no stage declares an answer shape — there is no decision for one to carry.</text>
  </g>

  <!-- legend -->
  <g transform="translate(50, 812)">
    <text class="lane" x="0" y="0">LEGEND</text>
    <g class="agent"><rect x="0" y="14" width="16" height="16" rx="4"/></g>
    <text class="edge-label" x="24" y="26">one agent</text>
    <g class="phase"><rect x="110" y="14" width="16" height="16" rx="4"/></g>
    <text class="edge-label" x="134" y="26">script phase</text>
    <g class="artifact"><rect x="0" y="40" width="16" height="16" rx="4"/></g>
    <text class="edge-label" x="24" y="52">persisted artifact</text>
    <g class="done"><rect x="140" y="40" width="16" height="16" rx="4"/></g>
    <text class="edge-label" x="164" y="52">terminal result</text>
  </g>
</svg>
