<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1470" width="1180" height="1470" role="img" aria-label="The plan workflow: what the script does, what each child agent receives and returns, and which artifacts the run persists.">
  <title>plan workflow — stages, child agents, and the text each one hands to the next</title>
  <desc>A read-only clarifier decides whether an operator must choose something first. If it must, the run persists the task and the questions and stops as awaiting_operator; the answers come back through a second run whose references the host verifies by digest. Then a context mapper reads the repository, and a drafting loop of at most four rounds alternates a planner and a critic until the critic accepts, or the round cap fails the run.</desc>

  <style>
    .bg { fill: #ffffff; }
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h1 { font-size: 21px; font-weight: 700; fill: #0f172a; }
    .h2 { font-size: 13px; fill: #475569; }
    .box-title { font-size: 14px; font-weight: 700; }
    .box-line { font-size: 11.5px; fill: #334155; }
    .chip { font-size: 10.5px; fill: #64748b; }
    .edge-label { font-size: 11px; fill: #475569; }
    .lane { font-size: 11px; font-weight: 700; fill: #94a3b8; letter-spacing: 0.08em; }

    .script rect { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.6; }
    .script .box-title { fill: #3730a3; }
    .agent rect { fill: #ecfdf5; stroke: #059669; stroke-width: 1.6; }
    .agent .box-title { fill: #065f46; }
    .artifact rect { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.4; }
    .artifact text { fill: #9a3412; font-size: 11px; }
    .pause rect { fill: #fffbeb; stroke: #d97706; stroke-width: 1.6; }
    .pause .box-title { fill: #92400e; }
    .stop rect { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.6; }
    .stop .box-title { fill: #991b1b; }
    .done rect { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.8; }
    .done .box-title { fill: #14532d; }

    .edge { stroke: #64748b; stroke-width: 1.6; fill: none; }
    .edge-soft { stroke: #94a3b8; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    .loop-frame { fill: none; stroke: #cbd5e1; stroke-width: 1.4; stroke-dasharray: 7 5; }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="a-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1180" height="1470"/>

  <text class="h1" x="60" y="40">plan — one task becomes a plan a critic accepted</text>
  <text class="h2" x="60" y="62">Deterministic script on the left, one child agent per call in the middle, persisted run artifacts on the right.</text>

  <text class="lane" x="60" y="88">WORKFLOW SCRIPT</text>
  <text class="lane" x="520" y="88">CHILD AGENTS</text>
  <text class="lane" x="970" y="88">RUN ARTIFACTS</text>

  <!-- 1. input -->
  <g class="script">
    <rect x="60" y="96" width="300" height="64" rx="10"/>
    <text class="box-title" x="80" y="122">Operator task</text>
    <text class="box-line" x="80" y="142">bounded text, at most 16 000 characters</text>
  </g>
  <path class="edge" d="M 210 160 L 210 196" marker-end="url(#a)"/>

  <!-- 2. clarify-task -->
  <g class="script">
    <rect x="60" y="196" width="300" height="100" rx="10"/>
    <text class="box-title" x="80" y="222">phase clarify-task</text>
    <text class="box-line" x="80" y="243">The script reads nothing itself. It asks whether</text>
    <text class="box-line" x="80" y="260">a human has to choose before planning starts.</text>
    <text class="chip" x="80" y="282">deterministic code · no repository access</text>
  </g>
  <g class="agent">
    <rect x="520" y="196" width="400" height="100" rx="10"/>
    <text class="box-title" x="540" y="222">1 · clarifier</text>
    <text class="box-line" x="540" y="243">receives — the operator task, verbatim</text>
    <text class="box-line" x="540" y="260">returns — continue, or up to 6 questions to ask</text>
    <text class="chip" x="540" y="282">read-only · read, git_read, grep, find · shaped answer</text>
  </g>
  <path class="edge" d="M 360 224 L 520 224" marker-end="url(#a)"/>
  <text class="edge-label" x="440" y="217" text-anchor="middle">prompt</text>
  <path class="edge" d="M 520 272 L 360 272" marker-end="url(#a)"/>
  <text class="edge-label" x="440" y="265" text-anchor="middle">answer</text>
  <g class="artifact">
    <rect x="970" y="224" width="170" height="44" rx="8"/>
    <text x="984" y="251">clarifier-decision.json</text>
  </g>
  <path class="edge-soft" d="M 920 246 L 970 246" marker-end="url(#a-soft)"/>

  <!-- 3. branch -->
  <path class="edge" d="M 210 296 L 210 336" marker-end="url(#a)"/>
  <g class="script">
    <rect x="60" y="336" width="300" height="64" rx="10"/>
    <text class="box-title" x="80" y="362">Which way the run goes</text>
    <text class="box-line" x="80" y="384">the script branches on the shaped decision only</text>
  </g>

  <!-- continue branch, routed down the left margin -->
  <path class="edge" d="M 60 368 L 30 368 L 30 838 L 60 838" marker-end="url(#a)"/>
  <text class="edge-label" x="22" y="600" text-anchor="middle" transform="rotate(-90 22 600)">continue — nothing needs an operator</text>

  <!-- 4. prepare the pause -->
  <path class="edge" d="M 210 400 L 210 430" marker-end="url(#a)"/>
  <text class="edge-label" x="222" y="420">needs_operator</text>
  <g class="script">
    <rect x="60" y="430" width="300" height="86" rx="10"/>
    <text class="box-title" x="80" y="456">Persist everything the answer needs</text>
    <text class="box-line" x="80" y="477">publishes the task and the readable questions,</text>
    <text class="box-line" x="80" y="494">then declares the run is waiting for a human</text>
  </g>
  <g class="artifact">
    <rect x="970" y="430" width="170" height="66" rx="8"/>
    <text x="984" y="455">task.md</text>
    <text x="984" y="478">clarification-questions.md</text>
  </g>
  <path class="edge-soft" d="M 360 463 L 970 463" marker-end="url(#a-soft)"/>

  <!-- 5. pause + resume -->
  <path class="edge" d="M 210 516 L 210 546" marker-end="url(#a)"/>
  <g class="pause">
    <rect x="60" y="546" width="300" height="100" rx="10"/>
    <text class="box-title" x="80" y="572">The run stops: awaiting_operator</text>
    <text class="box-line" x="80" y="593">Not a failure — no plan exists yet. The answers</text>
    <text class="box-line" x="80" y="610">come back as a second run, and the host proves</text>
    <text class="box-line" x="80" y="627">both references by digest before any code runs.</text>
  </g>

  <!-- 6. consume clarification -->
  <path class="edge" d="M 210 646 L 210 678" marker-end="url(#a)"/>
  <g class="script">
    <rect x="60" y="678" width="300" height="80" rx="10"/>
    <text class="box-title" x="80" y="704">phase consume-clarification</text>
    <text class="box-line" x="80" y="725">refuses anything but those two exact artifacts,</text>
    <text class="box-line" x="80" y="742">then persists what the operator answered</text>
  </g>
  <g class="artifact">
    <rect x="970" y="696" width="170" height="44" rx="8"/>
    <text x="984" y="723">clarification-answers.md</text>
  </g>
  <path class="edge-soft" d="M 360 718 L 970 718" marker-end="url(#a-soft)"/>
  <path class="edge" d="M 210 758 L 210 800" marker-end="url(#a)"/>

  <!-- 7. map-context -->
  <g class="script">
    <rect x="60" y="800" width="300" height="100" rx="10"/>
    <text class="box-title" x="80" y="826">phase map-context</text>
    <text class="box-line" x="80" y="847">The one stage that reads the repository widely,</text>
    <text class="box-line" x="80" y="864">so the drafting loop never has to go looking.</text>
    <text class="chip" x="80" y="886">runs once, on both paths</text>
  </g>
  <g class="agent">
    <rect x="520" y="800" width="400" height="100" rx="10"/>
    <text class="box-title" x="540" y="826">2 · context mapper</text>
    <text class="box-line" x="540" y="847">receives — the task and the clarification text</text>
    <text class="box-line" x="540" y="864">returns — the repository facts the task depends on</text>
    <text class="chip" x="540" y="886">read-only · adds ast_index · answer capped at 128 000 chars</text>
  </g>
  <path class="edge" d="M 360 828 L 520 828" marker-end="url(#a)"/>
  <text class="edge-label" x="440" y="821" text-anchor="middle">prompt</text>
  <path class="edge" d="M 520 876 L 360 876" marker-end="url(#a)"/>
  <text class="edge-label" x="440" y="869" text-anchor="middle">answer</text>
  <g class="artifact">
    <rect x="970" y="828" width="170" height="44" rx="8"/>
    <text x="984" y="855">context.md</text>
  </g>
  <path class="edge-soft" d="M 920 850 L 970 850" marker-end="url(#a-soft)"/>

  <!-- drafting loop -->
  <rect class="loop-frame" x="44" y="936" width="1110" height="290" rx="14"/>
  <text class="lane" x="60" y="958">DRAFTING LOOP · AT MOST 4 ROUNDS</text>

  <path class="edge" d="M 210 900 L 210 976" marker-end="url(#a)"/>

  <g class="script">
    <rect x="60" y="976" width="300" height="100" rx="10"/>
    <text class="box-title" x="80" y="1002">phase draft-plan</text>
    <text class="box-line" x="80" y="1023">One writer per round. Nothing is implemented</text>
    <text class="box-line" x="80" y="1040">here — the answer is the plan, as plain text.</text>
    <text class="chip" x="80" y="1062">round N of at most 4</text>
  </g>
  <g class="agent">
    <rect x="520" y="976" width="400" height="100" rx="10"/>
    <text class="box-title" x="540" y="1002">3 · planner</text>
    <text class="box-line" x="540" y="1023">receives — task, clarification, context, and the</text>
    <text class="box-line" x="540" y="1040">previous round's defects verbatim</text>
    <text class="chip" x="540" y="1062">returns the whole ordered plan · up to 256 000 chars</text>
  </g>
  <path class="edge" d="M 360 1004 L 520 1004" marker-end="url(#a)"/>
  <text class="edge-label" x="440" y="997" text-anchor="middle">prompt</text>
  <path class="edge" d="M 520 1052 L 360 1052" marker-end="url(#a)"/>
  <text class="edge-label" x="440" y="1045" text-anchor="middle">plan text</text>
  <g class="artifact">
    <rect x="970" y="1004" width="170" height="44" rx="8"/>
    <text x="984" y="1031">plan.md (per round)</text>
  </g>
  <path class="edge-soft" d="M 920 1026 L 970 1026" marker-end="url(#a-soft)"/>

  <path class="edge" d="M 210 1076 L 210 1106" marker-end="url(#a)"/>

  <g class="script">
    <rect x="60" y="1106" width="300" height="100" rx="10"/>
    <text class="box-title" x="80" y="1132">phase critique-plan</text>
    <text class="box-line" x="80" y="1153">The script branches on the verdict and never</text>
    <text class="box-line" x="80" y="1170">grades the prose itself.</text>
    <text class="chip" x="80" y="1192">accept ends the loop · revise starts another round</text>
  </g>
  <g class="agent">
    <rect x="520" y="1106" width="400" height="100" rx="10"/>
    <text class="box-title" x="540" y="1132">4 · critic</text>
    <text class="box-line" x="540" y="1153">receives — the plan under review, plus the same</text>
    <text class="box-line" x="540" y="1170">task, clarification, and context the planner had</text>
    <text class="chip" x="540" y="1192">read-only · reopens the files the plan names · accept or revise</text>
  </g>
  <path class="edge" d="M 360 1134 L 520 1134" marker-end="url(#a)"/>
  <text class="edge-label" x="440" y="1127" text-anchor="middle">prompt</text>
  <path class="edge" d="M 520 1182 L 360 1182" marker-end="url(#a)"/>
  <text class="edge-label" x="440" y="1175" text-anchor="middle">verdict</text>
  <g class="artifact">
    <rect x="970" y="1134" width="170" height="44" rx="8"/>
    <text x="984" y="1161">plan-critique.json</text>
  </g>
  <path class="edge-soft" d="M 920 1156 L 970 1156" marker-end="url(#a-soft)"/>

  <!-- revise: loop back -->
  <path class="edge" d="M 60 1156 L 32 1156 L 32 1026 L 60 1026" marker-end="url(#a)"/>
  <text class="edge-label" x="24" y="1091" text-anchor="middle" transform="rotate(-90 24 1091)">revise — up to 12 defects</text>

  <!-- accepted -->
  <path class="edge" d="M 160 1206 L 160 1256" marker-end="url(#a)"/>
  <text class="edge-label" x="172" y="1240">accept</text>
  <g class="done">
    <rect x="60" y="1256" width="440" height="86" rx="10"/>
    <text class="box-title" x="80" y="1282">The run returns the accepted plan</text>
    <text class="box-line" x="80" y="1303">Its final text is retained as plan.md — the only thing the</text>
    <text class="box-line" x="80" y="1320">follow-on plan-implement run is allowed to consume.</text>
  </g>

  <!-- round cap -->
  <path class="edge" d="M 300 1206 L 300 1240 L 750 1240 L 750 1256" marker-end="url(#a)"/>
  <text class="edge-label" x="530" y="1232" text-anchor="middle">a 4th revise instead of an accept</text>
  <g class="stop">
    <rect x="560" y="1256" width="380" height="86" rx="10"/>
    <text class="box-title" x="580" y="1282">No plan was accepted — the run fails</text>
    <text class="box-line" x="580" y="1303">The last draft is kept but never accepted, so it cannot</text>
    <text class="box-line" x="580" y="1320">reach an implementer. The open defects are reported.</text>
  </g>

  <!-- legend -->
  <g transform="translate(60, 1382)">
    <text class="lane" x="0" y="0">LEGEND</text>
    <g class="script"><rect x="0" y="14" width="18" height="18" rx="4"/></g>
    <text class="box-line" x="26" y="28">deterministic script</text>
    <g class="agent"><rect x="170" y="14" width="18" height="18" rx="4"/></g>
    <text class="box-line" x="196" y="28">one child agent call</text>
    <g class="artifact"><rect x="350" y="14" width="18" height="18" rx="4"/></g>
    <text class="box-line" x="376" y="28">persisted artifact</text>
    <g class="pause"><rect x="520" y="14" width="18" height="18" rx="4"/></g>
    <text class="box-line" x="546" y="28">run pauses for a human</text>
    <g class="stop"><rect x="720" y="14" width="18" height="18" rx="4"/></g>
    <text class="box-line" x="746" y="28">run fails closed</text>
    <g class="done"><rect x="880" y="14" width="18" height="18" rx="4"/></g>
    <text class="box-line" x="906" y="28">terminal result</text>
  </g>
</svg>
