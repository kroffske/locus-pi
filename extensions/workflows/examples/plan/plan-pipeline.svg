<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1000" width="1120" height="1000" role="img" aria-label="The plan workflow as three named agents: a scout hands the repository context to a planner, the planner hands a complete plan to a critic, and the critic either accepts it or hands defects back for another round.">
  <title>plan workflow — three agents and what each one hands to the next</title>
  <desc>A scout reads the repository and returns context.md. A planner receives the task, that context, its own previous draft and the critic's defects, and returns the complete plan every round. A critic receives the plan under review, the same evidence, and the defects the previous round reported, and returns accept or revise with up to twelve defects. Revise starts another round, up to six; accept ends the run with the plan text, which the plan-implement workflow consumes. A sixth revise retains the draft with its open defects and hands the decision to the operator, who accepts the last draft or answers with guidance that a continuation run redrafts under. The loop never pauses mid-round for a human: an open decision is recorded as a stated assumption and planned on.</desc>

  <style>
    .bg { fill: #ffffff; }
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h1 { font-size: 21px; font-weight: 700; fill: #0f172a; }
    .h2 { font-size: 13px; fill: #475569; }
    .lane { font-size: 11px; font-weight: 700; fill: #94a3b8; letter-spacing: 0.08em; }

    .agent rect { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .agent .name { font-size: 20px; font-weight: 700; fill: #065f46; }
    .agent .role { font-size: 12px; fill: #047857; }
    .agent .line { font-size: 12.5px; fill: #334155; }
    .agent .chip { font-size: 11px; fill: #64748b; }

    .phase rect { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.4; }
    .phase text { font-size: 12px; fill: #3730a3; font-weight: 700; }
    .artifact rect { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.4; }
    .artifact text { font-size: 11.5px; fill: #9a3412; }

    .io rect { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.6; }
    .io .name { font-size: 14px; font-weight: 700; fill: #334155; }
    .io .line { font-size: 12px; fill: #475569; }

    .done rect { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
    .done .name { font-size: 15px; font-weight: 700; fill: #14532d; }
    .done .line { font-size: 12px; fill: #334155; }
    .stop rect { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.8; }
    .stop .name { font-size: 15px; font-weight: 700; fill: #991b1b; }
    .stop .line { font-size: 12px; fill: #334155; }

    .handoff { stroke: #059669; stroke-width: 2.2; fill: none; }
    .handoff-label { font-size: 12.5px; fill: #065f46; font-weight: 700; }
    .edge { stroke: #64748b; stroke-width: 1.6; fill: none; }
    .edge-soft { stroke: #cbd5e1; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; }
    .edge-label { font-size: 11.5px; fill: #475569; }
    .loop-frame { fill: none; stroke: #cbd5e1; stroke-width: 1.4; stroke-dasharray: 7 5; }
  </style>

  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cbd5e1"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1120" height="1000"/>

  <text class="h1" x="50" y="40">plan — three agents, and what each hands to the next</text>
  <text class="h2" x="50" y="62">The loop never stops mid-round to ask. An open decision is written down as a stated assumption and planned on; only a stalled round cap hands the decision to the operator.</text>

  <text class="lane" x="50" y="92">SCRIPT PHASE</text>
  <text class="lane" x="330" y="92">AGENTS</text>
  <text class="lane" x="850" y="92">PERSISTED</text>

  <!-- operator input -->
  <g class="io">
    <rect x="330" y="104" width="440" height="52" rx="10"/>
    <text class="name" x="352" y="127">Operator task</text>
    <text class="line" x="352" y="146">ordinary words; the host bounds its length</text>
  </g>
  <g class="artifact">
    <rect x="850" y="110" width="220" height="40" rx="8"/>
    <text x="866" y="135">task.md</text>
  </g>
  <path class="edge-soft" d="M 770 130 L 850 130" marker-end="url(#s)"/>

  <path class="handoff" d="M 550 156 L 550 196" marker-end="url(#g)"/>
  <text class="handoff-label" x="562" y="182">the task, verbatim</text>

  <!-- scout -->
  <g class="phase">
    <rect x="50" y="196" width="200" height="34" rx="8"/>
    <text x="66" y="218">scout-repository</text>
  </g>
  <g class="agent">
    <rect x="330" y="196" width="440" height="124" rx="12"/>
    <text class="name" x="352" y="228">scout</text>
    <text class="role" x="352" y="248">Describes what exists. Proposes nothing.</text>
    <text class="line" x="352" y="272">receives — the operator task</text>
    <text class="line" x="352" y="291">returns — what exists today, and what it could not settle</text>
    <text class="chip" x="352" y="310">read-only · read, git_read, ast_index, grep, find</text>
  </g>
  <g class="artifact">
    <rect x="850" y="238" width="220" height="40" rx="8"/>
    <text x="866" y="263">context.md</text>
  </g>
  <path class="edge-soft" d="M 770 258 L 850 258" marker-end="url(#s)"/>

  <path class="handoff" d="M 550 320 L 550 400" marker-end="url(#g)"/>
  <text class="handoff-label" x="562" y="352">the repository facts the task depends on</text>
  <text class="edge-label" x="562" y="372">the only stage that reads the repository broadly</text>

  <!-- drafting loop -->
  <rect class="loop-frame" x="272" y="386" width="820" height="418" rx="16"/>
  <text class="lane" x="290" y="410">DRAFTING LOOP · AT MOST 6 ROUNDS · THE CRITIC IS THE EXIT</text>

  <!-- planner -->
  <g class="phase">
    <rect x="50" y="430" width="200" height="34" rx="8"/>
    <text x="66" y="452">draft-plan</text>
  </g>
  <g class="agent">
    <rect x="330" y="430" width="440" height="144" rx="12"/>
    <text class="name" x="352" y="462">planner</text>
    <text class="role" x="352" y="482">Writes the whole plan. Never implements it.</text>
    <text class="line" x="352" y="506">receives — the task, the scout's context, its own previous</text>
    <text class="line" x="352" y="524">draft, and the critic's defects</text>
    <text class="line" x="352" y="543">returns — the complete ordered plan, rewritten every round</text>
    <text class="chip" x="352" y="563">read-only · records what it assumed instead of asking</text>
  </g>
  <g class="artifact">
    <rect x="850" y="482" width="220" height="40" rx="8"/>
    <text x="866" y="507">plan.md (per round)</text>
  </g>
  <path class="edge-soft" d="M 770 502 L 850 502" marker-end="url(#s)"/>

  <path class="handoff" d="M 550 574 L 550 634" marker-end="url(#g)"/>
  <text class="handoff-label" x="562" y="610">the plan under review</text>

  <!-- critic -->
  <g class="phase">
    <rect x="50" y="664" width="200" height="34" rx="8"/>
    <text x="66" y="686">critique-plan</text>
  </g>
  <g class="agent">
    <rect x="330" y="634" width="440" height="144" rx="12"/>
    <text class="name" x="352" y="666">critic</text>
    <text class="role" x="352" y="686">Judges this plan. Does not write its own.</text>
    <text class="line" x="352" y="710">receives — the plan, the same task and context the planner</text>
    <text class="line" x="352" y="728">had, and the defects the previous round reported</text>
    <text class="line" x="352" y="747">returns — accept, or revise with up to 12 concrete defects</text>
    <text class="chip" x="352" y="767">read-only · reopens the files the plan names · declared shape</text>
  </g>
  <g class="artifact">
    <rect x="850" y="686" width="220" height="40" rx="8"/>
    <text x="866" y="711">plan-critique.json</text>
  </g>
  <path class="edge-soft" d="M 770 706 L 850 706" marker-end="url(#s)"/>

  <!-- revise: back to the planner -->
  <path class="handoff" d="M 330 706 L 296 706 L 296 502 L 330 502" marker-end="url(#g)"/>
  <text class="handoff-label" x="288" y="604" text-anchor="middle" transform="rotate(-90 288 604)">revise — the defects, verbatim</text>

  <!-- accept -->
  <path class="edge" d="M 470 778 L 470 850" marker-end="url(#a)"/>
  <text class="edge-label" x="482" y="826">accept</text>
  <g class="done">
    <rect x="50" y="850" width="500" height="94" rx="12"/>
    <text class="name" x="72" y="878">The run returns the accepted plan</text>
    <text class="line" x="72" y="900">Its final text is retained as plan.md — the one thing the follow-on</text>
    <text class="line" x="72" y="919">plan-implement run consumes into a reviewed sequential task ledger.</text>
  </g>

  <!-- round cap -->
  <path class="edge" d="M 650 778 L 650 814 L 880 814 L 880 850" marker-end="url(#a)"/>
  <text class="edge-label" x="768" y="806" text-anchor="middle">a 6th revise instead of an accept</text>
  <g class="stop">
    <rect x="610" y="850" width="460" height="94" rx="12"/>
    <text class="name" x="632" y="878">No draft accepted — the operator decides</text>
    <text class="line" x="632" y="900">task.md, context.md, the draft plan.md and unresolved-defects.md are</text>
    <text class="line" x="632" y="919">retained; one text question (plan-guidance) asks: accept last draft, or</text>
    <text class="line" x="632" y="936">answer with guidance a continuation run redrafts under.</text>
  </g>

  <!-- legend -->
  <g transform="translate(50, 968)">
    <text class="lane" x="0" y="0">LEGEND</text>
    <g class="agent"><rect x="72" y="-12" width="16" height="16" rx="4"/></g>
    <text class="edge-label" x="96" y="0">one agent</text>
    <g class="phase"><rect x="182" y="-12" width="16" height="16" rx="4"/></g>
    <text class="edge-label" x="206" y="0">script phase</text>
    <g class="artifact"><rect x="300" y="-12" width="16" height="16" rx="4"/></g>
    <text class="edge-label" x="324" y="0">persisted artifact</text>
    <path class="handoff" d="M 448 -4 L 486 -4" marker-end="url(#g)"/>
    <text class="edge-label" x="494" y="0">a handoff between agents</text>
    <g class="done"><rect x="672" y="-12" width="16" height="16" rx="4"/></g>
    <text class="edge-label" x="696" y="0">terminal result</text>
    <g class="stop"><rect x="806" y="-12" width="16" height="16" rx="4"/></g>
    <text class="edge-label" x="830" y="0">operator handoff</text>
  </g>
</svg>
