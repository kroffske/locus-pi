name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    name: Node 22 package contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Use Node 22.19.0
        uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install workflow system dependency
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Run source, test, and source-audit gates
        run: npm run check

      - name: Verify the clean repository inventory
        run: npm run check:repository

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Inspect the default extension inventory
        run: ./bin/locus-pi doctor

      - name: Confirm the installed Pi peer
        run: ./node_modules/.bin/pi --version

      - name: Build and inspect the npm candidate
        run: npm pack --dry-run --json --ignore-scripts
